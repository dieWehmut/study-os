name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version without the v prefix
        required: true
        type: string
      notes:
        description: Release notes in Markdown (optional; falls back to CHANGELOG.md)
        required: false
        type: string
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-windows:
    name: Windows ${{ matrix.arch }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            goarch: amd64
          - arch: arm64
            goarch: arm64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"
          cache: true
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Build frontend
        working-directory: frontend
        shell: pwsh
        run: |
          pnpm install --frozen-lockfile
          pnpm build
      - name: Install Wails
        shell: pwsh
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.13.0
      - name: Build desktop
        shell: pwsh
        env:
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          wails build -platform windows/${{ matrix.goarch }} -clean -o StudyOS.exe
          New-Item -ItemType Directory -Path "build/bin/windows-${{ matrix.arch }}" -Force | Out-Null
          Copy-Item -LiteralPath "build/bin/StudyOS.exe" -Destination "build/bin/windows-${{ matrix.arch }}/StudyOS.exe"
      - uses: actions/upload-artifact@v4
        with:
          name: study-os-windows-${{ matrix.arch }}
          path: build/bin/windows-${{ matrix.arch }}/StudyOS.exe
          if-no-files-found: error

  build-pwa:
    name: Build PWA launcher package
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"
          cache: true
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Build frontend
        working-directory: frontend
        shell: pwsh
        run: |
          pnpm install --frozen-lockfile
          pnpm build
      - name: Build PWA server and package
        shell: pwsh
        env:
          CGO_ENABLED: "0"
        run: |
          $version = if ('${{ github.event.inputs.version }}') { '${{ github.event.inputs.version }}' } else { '${{ github.ref_name }}'.TrimStart('v') }
          New-Item -ItemType Directory -Path "build/pwa/web" -Force | Out-Null
          go build -ldflags "-X study-os/backend/version.Version=$version" -o build/pwa/study-os-server.exe ./backend
          Copy-Item -Path "frontend/dist/*" -Destination "build/pwa/web" -Recurse -Force
          ./scripts/package-pwa-release.ps1 -Version $version -SkipBuild | Out-Host
      - uses: actions/upload-artifact@v4
        with:
          name: study-os-pwa-windows-x64
          path: release
          if-no-files-found: error

  publish:
    needs: [build-windows, build-pwa]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: build/bin
      - name: Normalize artifact layout
        shell: pwsh
        run: |
          foreach ($arch in @('x64', 'arm64')) {
            $source = "build/bin/study-os-windows-$arch/StudyOS.exe"
            $destination = "build/bin/windows-$arch"
            New-Item -ItemType Directory -Path $destination -Force | Out-Null
            Copy-Item -LiteralPath $source -Destination "$destination/StudyOS.exe"
          }
      - name: Download PWA package
        uses: actions/download-artifact@v4
        with:
          name: study-os-pwa-windows-x64
          path: release
      - name: Package archives and manifest
        shell: pwsh
        run: |
          $version = if ('${{ github.event.inputs.version }}') { '${{ github.event.inputs.version }}' } else { '${{ github.ref_name }}'.TrimStart('v') }
          $base = "https://github.com/${{ github.repository }}/releases/download/v$version"
          ./scripts/package-release.ps1 -Version $version -BaseUrl $base | Out-Host
      - name: Prepare release notes
        shell: pwsh
        env:
          NOTES: ${{ github.event.inputs.notes }}
        run: |
          $version = if ('${{ github.event.inputs.version }}') { '${{ github.event.inputs.version }}' } else { '${{ github.ref_name }}'.TrimStart('v') }
          if ($env:NOTES) {
            Set-Content -LiteralPath 'release-notes.md' -Value $env:NOTES -Encoding UTF8
          } else {
            $changelog = Get-Content -LiteralPath 'CHANGELOG.md' -Raw
            $pattern = "(?ms)^## v?$([regex]::Escape($version))\s*$.*?(?=^## |\z)"
            $match = [regex]::Match($changelog, $pattern)
            if ($match.Success) {
              Set-Content -LiteralPath 'release-notes.md' -Value $match.Value.Trim() -Encoding UTF8
            } else {
              Set-Content -LiteralPath 'release-notes.md' -Value "## v$version" -Encoding UTF8
            }
          }
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || format('v{0}', github.event.inputs.version) }}
          draft: false
          generate_release_notes: false
          body_path: release-notes.md
          files: |
            release/*.zip
            release/*.sha256
            release/manifest.json
