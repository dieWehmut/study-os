name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    name: Build static frontend
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Verify static Pages contract
        run: node scripts/tests/github-pages.test.mjs

      - name: Install frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Test static frontend runtime
        working-directory: frontend
        run: >-
          pnpm exec vitest run
          src/lib/runtime.test.ts
          src/lib/routing.test.ts
          src/lib/pwa.test.ts
          src/api/client.test.ts
          src/api/static-demo.test.ts
          --pool=threads
          --maxWorkers=1

      - name: Lint frontend
        working-directory: frontend
        run: pnpm lint

      - name: Build frontend showcase
        working-directory: frontend
        env:
          VITE_STATIC_DEMO: "true"
          VITE_BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: pnpm build

      - name: Verify Pages artifact
        env:
          PAGES_BASE_PATH: ${{ steps.pages.outputs.base_path }}
          PAGES_DIST: frontend/dist
        run: node scripts/tests/github-pages-artifact.test.mjs

      - name: Install Chromium for Pages smoke
        working-directory: frontend
        run: pnpm exec playwright install --with-deps chromium

      - name: Smoke test built Pages artifact
        working-directory: frontend
        env:
          PAGES_PREVIEW: "true"
          VITE_STATIC_DEMO: "true"
          VITE_BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: pnpm exec playwright test --config=playwright.pages.config.ts

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

  deploy:
    name: Publish static frontend
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
